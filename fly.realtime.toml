# flyctl deploy --config fly.realtime.toml --dockerfile infra/Dockerfile.realtime
app = "prommatch-realtime"
primary_region = "iad"

[build]
  dockerfile = "infra/Dockerfile.realtime"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "10s"
  interval = "15s"
  method = "GET"
  path = "/health"
  timeout = "5s"

# Secrets: DATABASE_URL, REDIS_URL, REALTIME_JWT_SECRET (must match
# prommatch-web's value), REALTIME_CORS_ORIGINS (prommatch-web's origin)
